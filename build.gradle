// Shared build configuration for the J's Tech Series: every subproject is one mod (or the core library),
// built with the same toolchain, the same NeoForge version and the same version number.
plugins {
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// The version every artifact carries (the jar names and the mod metadata alike). A build from a tree that is
// not the tagged release commit is a snapshot named after the commit it came from, "0.2.0a-SNAPSHOT.6a288a7":
// the loader orders a snapshot below its release and above the previous one, so a development jar never
// shadows a release. Build the tagged release with -Prelease to drop the suffix.
def gitShortSha = providers.exec {
    commandLine 'git', 'rev-parse', '--short', 'HEAD'
    ignoreExitValue = true
}.standardOutput.asText.map { it.trim() }.getOrElse('')
version = providers.gradleProperty('release').isPresent()
        ? mod_version
        : "${mod_version}-SNAPSHOT.${gitShortSha.isEmpty() ? 'local' : gitShortSha}"
group = mod_group_id

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'idea'

    version = rootProject.version
    group = rootProject.group

    // Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    repositories {
        // Maven Central: test dependencies (JUnit) and any non-Minecraft library that lives there.
        mavenCentral()
        // ModMaven mirror: dev-runtime mods used for integration testing.
        maven {
            name = 'ModMaven'
            url = 'https://modmaven.dev/'
            content {
                includeGroup 'mekanism'
                includeGroup 'appeng'
            }
        }
        // BlameJared: JEI, present in the dev client for recipe lookups while testing autocrafting.
        maven {
            name = 'BlameJared'
            url = 'https://maven.blamejared.com'
            content { includeGroup 'mezz.jei' }
        }
        // Create + its libraries (Flywheel, Ponder): dev-runtime only, heavy kinetic tick load for stress testing.
        maven {
            name = 'CreateMod'
            url = 'https://maven.createmod.net/'
        }
        // Registrate: Create's registration library.
        maven {
            name = 'Tterrag'
            url = 'https://maven.tterrag.com/'
        }
        // GeckoLib: shipped dependency of the computing mod, for the large block models with bones and animation.
        maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content { includeGroupByRegex 'software\\.bernie.*' }
        }
    }

    // Sets up a dependency configuration called 'localRuntime': a dependency present for runtime testing that
    // is "optional", meaning it will not be pulled by dependents of this mod.
    configurations {
        localRuntime
        runtimeClasspath.extendsFrom localRuntime
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.named('test', Test).configure {
        useJUnitPlatform()
    }

    // IDEA no longer downloads sources/javadoc jars for dependencies on its own.
    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }

    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                from components.java
            }
        }
        repositories {
            maven {
                url = "file://${rootProject.projectDir}/repo"
            }
        }
    }
}
