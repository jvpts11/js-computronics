mekanism_version=1.21.1-10.7.19.85
# Applied Energistics 2 — a second storage/autocrafting network, for coexistence + integration stress.
ae2_version=19.0.27
# Create — heavy kinetic/contraption tick simulation for load testing.
create_version=6.0.11-292
# JEI in the dev client for recipe lookups while testing autocrafting.
jei_version=19.44.0.405
# GeckoLib: the model + animation library the racks (and future animated machines) render through.
geckolib_version=4.7.6